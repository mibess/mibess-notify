name: mibess-notify-hml
services:
  backend:
    image: ${REGISTRY}/mibess-notify-backend:${IMAGE_TAG:?immutable commit required}
    container_name: mibess-notify-backend-hml
    restart: unless-stopped
    env_file: /opt/mibess-notify/secrets/hml.env
    environment:
      NOTIFY_ENV: hml
      DB_HOST: postgres-hml
      DB_NAME: mibess_notify_hml
      DB_USERNAME: mibess_notify_hml
      RABBITMQ_HOST: mibess-notify-rabbitmq
      RABBITMQ_VHOST: /mibess-notify-hml
      RABBITMQ_USER: mibess_notify_hml
      FAKE_PROVIDER_ENABLED: "true"
    networks: [app, shared-db-network, notify-broker]
    mem_limit: 768m
    cpus: 1.5
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  frontend:
    image: ${REGISTRY}/mibess-notify-frontend:${IMAGE_TAG:?immutable commit required}
    container_name: mibess-notify-frontend-hml
    restart: unless-stopped
    depends_on: [backend]
    networks: [app, notify-edge]
    ports: ["127.0.0.1:8391:8080"]
    mem_limit: 96m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
networks:
  app:
  shared-db-network: { external: true }
  notify-broker: { external: true }
  notify-edge: { external: true }
